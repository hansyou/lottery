<div id="setupPanel" class="panel setup-panel fade-in">
    <h1>🎉 婚礼抽奖工具</h1>

    <div class="form-group">
        <label for="title">活动标题</label>
        <input type="text" id="title" placeholder="请输入活动标题" value="婚礼抽奖">
    </div>

    <div class="form-group">
        <label for="participants">参与人员 <span class="hint">(每行一个名字)</span></label>
        <textarea id="participants" rows="10" placeholder="请输入参与人员名单，每行一个名字&#10;例如：&#10;张三&#10;李四&#10;王五"></textarea>
    </div>

    <div class="form-group">
        <label>奖项设置</label>
        <div id="prizeList" class="prize-list">
            <!-- 奖项将动态生成 -->
        </div>
        <button id="addPrizeBtn" class="btn btn-secondary">+ 添加奖项</button>
    </div>

    <button id="startBtn" class="btn btn-primary">开始抽奖</button>
</div>
